<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>B v2 · Certificaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;display=swap">
<style>
body{margin:0;background:#F5F5F3}
a{color:#0E1116}a:hover{color:#0E1116}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,40px);box-sizing:border-box}
.nl{color:#5B6270;text-decoration:none;font-size:14px;padding:10px 0;position:relative;transition:color .2s}
.nl:hover{color:#0E1116}
.nl.on{color:#0E1116}
.nl.on::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:2px;border-radius:2px;background:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;background:#EBEBE7;border-radius:12px}
.fb{height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:#5B6270;font:inherit;font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.fb:hover{color:#0E1116}
.fb.on{background:#FFFFFF;color:#0E1116;box-shadow:0 1px 2px rgba(14,17,22,.08)}
.cert{display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #E6E6E2;border-radius:16px;overflow:hidden;text-decoration:none;color:#0E1116;transition:border-color .25s,transform .35s cubic-bezier(.2,.7,.2,1)}
.cert:hover{border-color:#CFCFCA;transform:translateY(-2px);color:#0E1116}
.thumb{background:#F5F5F3;padding:20px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #F0F0EC}
.thumb img{display:block;width:100%;aspect-ratio:1.414;object-fit:contain;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.cert:hover .thumb img{transform:scale(1.03)}
.go{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--accent)}
.go svg{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.cert:hover .go svg{transform:translate(2px,-2px)}
.menu{display:none}
.ic{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:#5B6270;transition:color .2s,background .2s}
.ic:hover{color:#0E1116;background:#EBEBE7}
@media (prefers-reduced-motion: no-preference){
.motion .up{animation:c-up .8s cubic-bezier(.2,.7,.2,1) both}
}
@keyframes c-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width: 860px){.links{display:none !important}.menu{display:inline-flex}}
</style>
</helmet>
<div class="{{motion}}" style="--accent: {{accent}}; min-height: 1250px; background: #F5F5F3; color: #0E1116; font-family: Geist, system-ui, sans-serif; padding-bottom: 80px">
  <nav class="wrap" style="display: flex; justify-content: space-between; align-items: center; height: 84px; gap: 24px">
    <a href="B2-Etapas.dc.html" style="font-weight: 600; font-size: 15px; text-decoration: none; letter-spacing: -0.01em">Gonzalo Suarez</a>
    <div class="links" style="display: flex; align-items: center; gap: 32px">
      <a class="nl" href="B2-Etapas.dc.html">Inicio</a>
      <a class="nl" href="B2-Experiencia.dc.html">Experiencia</a>
      <a class="nl" href="B2-Proyectos.dc.html">Proyectos</a>
      <a class="nl on" href="B2-Certificaciones.dc.html">Certificaciones</a>
      <a class="nl" href="mailto:gonzalosuarez9977@gmail.com">Contacto</a>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #DCDCD7; border-radius: 8px; background: #FFFFFF; color: #0E1116; font: inherit; font-size: 13px; cursor: pointer">ES / EN</button>
      <button class="menu" type="button" aria-label="Abrir menú" style="width: 44px; height: 44px; align-items: center; justify-content: center; border: 1px solid #DCDCD7; border-radius: 10px; background: #FFFFFF">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1116" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h16M4 16h16"></path></svg>
      </button>
    </div>
  </nav>

  <div class="wrap" style="display: flex; flex-direction: column; gap: 32px; padding-top: 56px">
    <header class="up" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px 40px">
      <div style="display: flex; flex-direction: column; gap: 12px; max-width: 620px">
        <h1 style="margin: 0; font-size: clamp(34px, 3.6vw, 46px); line-height: 1.08; letter-spacing: -0.035em; font-weight: 600">Certificaciones</h1>
        <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #4A505C; text-wrap: pretty">Formación complementaria en desarrollo, bases de datos e infraestructura.</p>
      </div>
      <div class="seg" role="group" aria-label="Filtrar certificaciones">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button type="button" class="fb {{f.cls}}" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}">{{f.label}}</button>
        </sc-for>
      </div>
    </header>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 16px">
      <sc-for list="{{certs}}" as="c" hint-placeholder-count="8">
        <a class="cert up" href="#" style="animation-delay: {{c.delay}}">
          <div class="thumb"><img src="{{c.img}}" alt="Certificado: {{c.title}}"></div>
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px 18px; flex: 1">
            <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3">{{c.title}}</span>
            <span style="font-size: 14px; color: #5B6270">{{c.place}}</span>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 10px">
              <span style="font-size: 13px; color: #5B6270; font-variant-numeric: tabular-nums">{{c.date}}</span>
              <span class="go">Ver
                <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"></path></svg>
              </span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>
  <footer class="wrap" style="margin-top: 112px">
    <div style="border-top: 1px solid #E6E6E2; padding-top: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px">
      <span style="font-size: 14px; color: #5B6270">Desarrollado por Gonzalo Suarez</span>
      <div style="display: flex; align-items: center; gap: 8px">
        <a class="ic" href="https://github.com/gonzalosuarez2001" aria-label="GitHub"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg></a>
        <span aria-hidden="true" style="width: 1px; height: 20px; background: #DCDCD7"></span>
        <a class="ic" href="https://www.linkedin.com/in/suarez-gonzalo/" aria-label="LinkedIn"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg></a>
      </div>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#4070F4","#0E1116","#0F6B5C"]},"animaciones":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":1250}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'Todas' };
  }
  renderVals() {
    const all = [
      { title: 'Docker y Kubernetes', place: 'Universidad Tecnológica Nacional', date: 'sep 2024', cat: 'Infraestructura', img: '/_blob/8c48957af1e47bc6fcaf0edef84054b5' },
      { title: 'Bootcamp Credencial UTN', place: 'Universidad Tecnológica Nacional', date: 'mar 2024', cat: 'Desarrollo', img: '/_blob/21e606990599b1b44ff5e6f9efb6c4f7' },
      { title: 'Desarrollo en React', place: 'Universidad Tecnológica Nacional', date: 'nov 2023', cat: 'Desarrollo', img: '/_blob/92096e4cb7c50095e8d5884551a341bc' },
      { title: 'Diplomatura en Bases de Datos', place: 'Universidad Tecnológica Nacional', date: 'oct 2023', cat: 'Bases de datos', img: '/_blob/2d334d252eede18fa1156b4ce14cda81' },
      { title: 'Desarrollo en JavaScript', place: 'Universidad Tecnológica Nacional', date: 'jun 2023', cat: 'Desarrollo', img: '/_blob/c8419f551acbf7c53a6c2e2fe854cdfa' },
      { title: 'Diplomatura Full Stack', place: 'Universidad Tecnológica Nacional', date: 'may 2023', cat: 'Desarrollo', img: '/_blob/4ed9e454cd27ac25086d85a468fb601a' },
      { title: 'Fundamentos de Bases de Datos', place: 'Universidad Tecnológica Nacional', date: 'sep 2022', cat: 'Bases de datos', img: '/_blob/fd568f70020933f8309192f3b5295e9b' },
      { title: 'Diploma en Estudios Superiores de Inglés', place: 'Instituto Cambridge', date: 'dic 2017', cat: 'Idiomas', img: '/_blob/47963912153eb9c9d380106bfdacab98' }
    ];
    const f = this.state.filter;
    const certs = all.filter((c) => f === 'Todas' || c.cat === f)
      .map((c, i) => ({ ...c, delay: (0.08 + i * 0.05).toFixed(2) + 's' }));
    const filters = ['Todas', 'Desarrollo', 'Bases de datos', 'Infraestructura', 'Idiomas'].map((label) => ({
      label, cls: label === f ? 'on' : '', pressed: label === f ? 'true' : 'false',
      pick: () => this.setState({ filter: label })
    }));
    return {
      accent: this.props.accent ?? '#2F5BEA',
      motion: this.props.animaciones === false ? 'still' : 'motion',
      certs, filters
    };
  }
}
</script>
</body>
</html>
